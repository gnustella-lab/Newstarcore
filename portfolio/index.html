<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio | Newstarcore</title>
    <meta name="description" content="Projetos, ferramentas e bibliotecas construídas por Newstarcore.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <canvas id="aurora-canvas" aria-hidden="true"></canvas>
    <header class="site-header">
        <nav class="container nav" aria-label="Navegação principal">
            <a href="../" class="logo" aria-label="Newstarcore home">
                <span class="logo-mark">NS</span>
                <span class="logo-text"><strong>Newstarcore</strong><small>personal hub</small></span>
            </a>
            <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links">
                <li><a href="../blog/">Blog</a></li>
                <li><a href="./" aria-current="page">Portfólio</a></li>
                <li><a href="../store/">Loja</a></li>
                <li><a href="../dashboard/">Dashboard</a></li>
                <li><a href="../ia-preview/">IA</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="page-hero compact-hero reveal">
            <p class="eyebrow">Trabalhos</p>
            <h1>Portfólio</h1>
            <p>Projetos com foco em sistemas, ferramentas e interfaces reutilizáveis.</p>
        </section>

        <section class="toolbar reveal" aria-label="Filtro de projetos">
            <label for="tech-filter">Tecnologia</label>
            <select id="tech-filter" class="search-box">
                <option value="all">Todas</option>
                <option value="Node.js">Node.js</option>
                <option value="React">React</option>
                <option value="Go">Go</option>
                <option value="Tailwind">Tailwind</option>
            </select>
        </section>

        <section class="grid-3" id="portfolio-grid" aria-live="polite">
            <p class="muted">Carregando projetos...</p>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-grid">
            <p>&copy; 2026 Newstarcore</p>
            <ul class="footer-links">
                <li><a href="https://github.com/gnustella-lab/Newstarcore" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            </ul>
        </div>
    </footer>
    <script src="../js/main.js"></script>
</body>
</html>
