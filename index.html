<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Name | Projects & Social Media</title>
  <meta name="description" content="Explore my projects and find me on social media.">
  <meta name="theme-color" content="#0d1117">

  <!-- Open Graph metadata -->
  <meta property="og:title" content="Your Name | Projects & Social Media">
  <meta property="og:description" content="Explore my projects and find me on social media.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gnustella-lab.github.io/Newstarcore/">
  <meta property="og:image" content="https://github.com/identicons/placeholder.png">

  <!-- Emoji favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">

  <!-- Font Awesome icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  >

  <style>
    :root {
      color-scheme: dark;
      --background: #0d1117;
      --card: #161b22;
      --card-hover: #1c2129;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(920px, calc(100% - 32px));
      margin-inline: auto;
    }

    .profile {
      padding: 56px 0 36px;
      text-align: center;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border: 3px solid var(--accent);
      border-radius: 50%;
      object-fit: cover;
      background: var(--card);
      box-shadow: 0 0 0 6px rgb(88 166 255 / 10%);
    }

    h1 {
      margin: 20px 0 6px;
      color: #f0f6fc;
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      letter-spacing: -0.03em;
    }

    .tagline {
      margin: 0;
      color: var(--muted);
    }

    main {
      flex: 1;
    }

    .links-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      padding-bottom: 56px;
    }

    .column {
      min-width: 0;
    }

    .column h2 {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .card-list {
      display: grid;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 84px;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .link-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      background: var(--card-hover);
      box-shadow: 0 12px 28px rgb(0 0 0 / 28%);
    }

    .link-card:focus-visible {
      outline: 3px solid rgb(88 166 255 / 45%);
      outline-offset: 3px;
    }

    .card-icon {
      display: grid;
      flex: 0 0 46px;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 10px;
      background: rgb(88 166 255 / 12%);
      color: var(--accent);
      font-size: 1.25rem;
    }

    .card-title {
      flex: 1;
      color: #f0f6fc;
      font-size: 1.05rem;
      font-weight: 650;
    }

    .card-arrow {
      color: var(--muted);
      font-size: 0.85rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .link-card:hover .card-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    footer {
      padding: 22px 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
    }

    footer p {
      margin: 0;
    }

    @media (min-width: 600px) {
      .links-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="profile container">
    <img
      class="avatar"
      src="https://github.com/identicons/placeholder.png"
      alt="Your Name profile picture"
      width="104"
      height="104"
    >
    <h1>Your Name</h1>
    <p class="tagline">Projects, experiments, and places to find me.</p>
  </header>

  <main class="container">
    <div class="links-grid">
      <section class="column" aria-labelledby="projects-title">
        <h2 id="projects-title">Projects</h2>
        <div class="card-list">
          <a class="link-card" href="https://gnustella-lab.github.io/sImage/" target="_blank" rel="noopener noreferrer">
            <span class="card-icon" aria-hidden="true"><i class="fa-regular fa-image"></i></span>
            <span class="card-title">sImage</span>
            <i class="fa-solid fa-arrow-up-right-from-square card-arrow" aria-hidden="true"></i>
          </a>

          <!-- Add more project cards here -->
        </div>
      </section>

      <section class="column" aria-labelledby="social-title">
        <h2 id="social-title">Social Media</h2>
        <div class="card-list">
          <a class="link-card" href="https://x.com/newstarcore" target="_blank" rel="noopener noreferrer">
            <span class="card-icon" aria-hidden="true"><i class="fa-brands fa-x-twitter"></i></span>
            <span class="card-title">X / Twitter</span>
            <i class="fa-solid fa-arrow-up-right-from-square card-arrow" aria-hidden="true"></i>
          </a>

          <!-- Add more social media cards here -->
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="current-year"></span> Your Name. All rights reserved.</p>
  </footer>

  <script>
    // Keep the copyright year current automatically.
    document.getElementById("current-year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
